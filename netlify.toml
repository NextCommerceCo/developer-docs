# Campaigns SDK reference moved to cart-sdk.nextcommerce.com
#
# Each rule points at the section that absorbed the old page, not at the site
# root. The SDK site consolidated ~160 narrative pages into six reference pages
# plus the page-type guides, so the mapping is many-to-one — but a redirect to
# the root reads as a soft 404 to Google and drops the URL from the index, which
# is what Search Console reported between 2026-08-22 and 2026-09-07.
#
# Order is load-bearing: Netlify takes the first match, so every deep path has to
# stay above its parent wildcard. Anchors were verified against the built site.
#
# Two deliberate gaps:
#   - No `/docs/campaigns/utilities/*` catch-all, and no FOMO rule. FOMO is gone
#     from the SDK (no matches in src/), so those URLs must 404 rather than land
#     on a page that does not document them. The catch-all would have swallowed
#     them, which is why only the three surviving utilities are listed.
#   - `/docs/campaigns/campaign-cart/cart-system` is not listed: the generic
#     `campaign-cart/:path` rule above already rewrites it to
#     `/docs/campaigns/cart-system`, which these rules then resolve.

[[redirects]]
  from = "/docs/campaigns/utilities/exit-intent"
  to = "https://cart-sdk.nextcommerce.com/latest/reference/javascript-api/#on-page-popups"
  status = 301

[[redirects]]
  from = "/docs/campaigns/utilities/exit-intent/*"
  to = "https://cart-sdk.nextcommerce.com/latest/reference/javascript-api/#on-page-popups"
  status = 301

[[redirects]]
