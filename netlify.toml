# Campaigns SDK reference moved to cart-sdk.nextcommerce.com
#
# Every rule is an EXACT path and there are no wildcards in this block. That is
# deliberate. An earlier version listed specific paths above parent wildcards and
# relied on first-match-wins; on Cloudflare the parent wildcard won anyway, so
# /docs/campaigns/checkout/payment landed on the generic checkout page instead of
# the payment section. Enumerating every path means no two rules can match the
# same URL and precedence stops mattering on either host.
#
# The list comes from the pages deleted in this repo's history, plus three URLs
# Search Console has indexed that predate that history (two analytics examples
# and campaign-cart/cart-system). Anything under /docs/campaigns/ not listed here
# either still exists (api/, page-kit, templates, admin-api) or never did.
#
# Destinations are sections, not the site root. The SDK site consolidated ~140
# narrative pages into six reference pages plus the page-type guides, so the
# mapping is many-to-one — but a redirect to the root reads as a soft 404 to
# Google and drops the URL from the index, which is what Search Console reported
# between 2026-08-22 and 2026-09-07. Every destination page and anchor is
# verified against the built SDK site.
#
# FOMO is absent on purpose: the feature is gone from the SDK (no matches in
# src/), so its five old paths 404 rather than land somewhere that does not
# document them.

