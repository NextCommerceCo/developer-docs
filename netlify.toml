[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"

[build.processing.html]
  pretty_urls = false

[[redirects]]
  from = "/api/admin"
  to = "/docs/admin-api"
  status = 301

[[redirects]]
  from = "/apps/oauth"
  to = "/docs/apps/oauth"
  status = 301

[[redirects]]
  from = "/apps/app-development-flow"
  to = "/docs/apps/app-development-flow"
  status = 301

[[redirects]]
  from = "/apps"
  to = "/docs/apps"
  status = 301

[[redirects]]
  from = "/themes"
  to = "/docs/storefront/themes"
  status = 301

[[redirects]]
  from = "/docs/themes"
  to = "/docs/storefront/themes"
  status = 301

[[redirects]]
  from = "/docs/themes/event-tracking"
  to = "/docs/storefront/event-tracking"
  status = 301

[[redirects]]
  from = "/webhooks"
  to = "/docs/webhooks"
  status = 301

[[redirects]]
  from = "/docs/api/admin/:path"
  to = "/docs/admin-api/:path"
  status = 301

[[redirects]]
  from = "/docs/campaign-cart/:path"
  to = "/docs/campaigns/:path"
  status = 301

[[redirects]]
  from = "/docs/campaigns/campaign-cart/:path"
  to = "/docs/campaigns/:path"
  status = 301

[[redirects]]
  from = "/docs/campaigns/api/reference"
  to = "/docs/campaigns/api"
  status = 301

[[redirects]]
  from = "/docs/api/campaigns/:path"
  to = "/docs/campaigns/api/:path"
  status = 301

