openapi: 3.0.3
paths:
  /api/v1/addresses/autocomplete/:
    get:
      description: Autocomplete address suggestions based on partial input.
      operationId: addressAutocomplete
      parameters:
        - description: Optional ISO 3166-1 country code(s) to filter results, e.g. 'US' or 'US,CA,MX'.
          in: query
          name: country
          schema:
            type: string
        - description: Optional BCP47 language code(s) for the results, e.g. 'en' or 'en,th'.
          in: query
          name: language
          schema:
            type: string
        - description: Partial address input to search for suggestions.
          in: query
          name: query_text
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultsAddressAutocomplete'
          description: ''
      security:
        - API Authentication: []
      tags:
        - address
  /api/v1/campaigns/:
    get:
      description: Retrieve campaign details.
      operationId: campaignRetrieve
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
          description: ''
      security:
        - API Authentication: []
      tags:
        - campaigns
  /api/v1/carts/:
    post:
      description: Create a new cart.
      operationId: cartsCreate
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartBase'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CartBase'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CartBase'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: ''
      security:
        - API Authentication: []
      tags:
        - carts
  /api/v1/carts/calculate/:
    post:
      description: Calculate cart summary.
      operationId: cartsCalculate
      parameters:
        - description: Set to true when calculating from an upsell page; skips site-wide offers.
          in: query
          name: upsell
          schema:
            type: boolean
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartCalculateSummary'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CartCalculateSummary'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CartCalculateSummary'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartSummary'
          description: ''
      security:
        - API Authentication: []
      tags:
        - carts
  /api/v1/orders/:
    post:
      description: Create a new order.
      operationId: ordersCreate
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrder'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateOrder'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateOrder'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: ''
      security:
        - API Authentication: []
      tags:
        - orders
  /api/v1/orders/{ref_id}/:
    get:
      description: Retrieve specific order details.
      operationId: orderRetrieve
      parameters:
        - description: Order reference ID
          in: path
          name: ref_id
          required: true
          schema:
            type: string
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: ''
      security:
        - API Authentication: []
      tags:
        - orders
  /api/v1/orders/{ref_id}/upsells/:
    post:
      description: Add an upsell to an existing order.
      operationId: ordersUpsellCreate
      parameters:
        - description: Order reference ID
          in: path
          name: ref_id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddUpsellLine'
          application/x-www-form-urlencoded:
